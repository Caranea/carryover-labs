# docker compose up, then open http://localhost:3000. This one service is the app and the API.
services:
  carryover:
    build: .
    # Always rebuild, so a plain `docker compose up` can't start an image from an older checkout.
    pull_policy: build
    ports:
      # Local only: the API spends your Meta credits, so don't publish it on your network.
      - '127.0.0.1:3000:3000'
    # Optional: the same api/.env as a local run (META_MODEL_API_KEY, MODEL_DAILY_BUDGET_USD).
    # Without a key, /demo, the sample patient and on-device redaction work; your own documents aren't read.
    env_file:
      - path: api/.env
        required: false
    environment:
      # Fixed inside the container, whatever api/.env says.
      HOST: 0.0.0.0
      PORT: '3000'
      APP_URL: http://localhost:3000
    restart: unless-stopped
