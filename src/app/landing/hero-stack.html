@for (r of [run()]; track r) {
  <div class="scene" [class.is-playing]="started()" aria-hidden="true">
    <div class="tilt">
      <div class="source-stack">
        <!-- Anonymized Jane_Doe_021 photo; the original already has soft focus. -->
        <div class="card bg-base-100 shadow-xl border border-base-300 printout">
          <div class="photo-frame">
            <div class="photo-sheet">
              <img
                src="images/hero-lab-report.webp"
                width="900"
                height="1195"
                alt=""
                fetchpriority="high"
                decoding="async"
                class="report-photo"
              />
              <span class="photo-mask name-mask"></span>
              <span class="photo-mask address-mask"></span>
              <span class="photo-mask phone-mask"></span>
              <span class="photo-mask reference-mask"></span>
              <span class="photo-mask contact-mask"></span>
              <span class="photo-mask doctor-mask"></span>
              <span class="photo-mask record-mask"></span>
              <span class="photo-highlight"></span>
            </div>
          </div>
          <p class="photo-caption">Old lab printout <span>Anonymized example</span></p>
        </div>

        <div class="card bg-base-100 shadow-lg border border-base-300 promise">
          <div class="card-body p-4 flex-row items-center justify-center gap-3">
            <span class="grid place-items-center size-9 rounded-full bg-success/15 text-success"
              ><app-icon name="lock" size="1.1rem"
            /></span>
            <span class="text-sm leading-tight"
              >Original file<br /><span class="text-base-content/60">never uploaded</span></span
            >
          </div>
        </div>
      </div>

      <span class="flow-arrow"><app-icon name="arrow-right" size="1.5rem" /></span>

      <div class="result-stack">
        <!-- What gets removed -->
        <div class="card bg-base-100 shadow-xl border border-base-300 toggles">
          <div class="card-body p-5 gap-3">
            <div class="flex items-center gap-2">
              <span class="grid place-items-center size-8 rounded-full bg-primary/10 text-primary"
                ><app-icon name="shield" size="1.1rem"
              /></span>
              <span class="font-display font-semibold">Removed before upload</span>
            </div>
            @for (label of removed; track label) {
              <div class="flex items-center justify-between gap-6 text-sm">
                <span>{{ label }}</span>
                <span class="removal-check"><app-icon name="check" size="0.85rem" /></span>
              </div>
            }
          </div>
        </div>

        <!-- One test across labs and countries -->
        <div class="card bg-base-100 shadow-xl border border-base-300 chart">
          <div class="card-body p-5 gap-2">
            <p class="text-xs text-base-content/60">Platelets · PLT · Thrombozyten</p>
            <div class="flex items-center justify-between gap-3">
              <p class="font-display text-2xl font-semibold">
                {{ latest.value }}
                <span class="text-sm font-normal text-base-content/60">× 10⁹/l</span>
              </p>
              <span class="badge badge-accent badge-sm">Latest result</span>
            </div>
            <svg [attr.viewBox]="'0 0 ' + w + ' ' + h" class="w-full">
              <rect
                x="0"
                y="0"
                [attr.width]="w"
                [attr.height]="plotHeight"
                rx="8"
                class="chart-surface"
              />
              <polyline [attr.points]="line" class="line" pathLength="1" />
              @for (p of points; track $index) {
                <circle
                  [attr.cx]="px($index)"
                  [attr.cy]="py(p.value)"
                  [attr.r]="$last ? 5 : 3.5"
                  [class.last]="$last"
                  class="pt"
                  [style.--point-delay]="$index * 0.25 + 's'"
                />
                <text
                  [attr.x]="px($index)"
                  [attr.y]="plotHeight + 17"
                  text-anchor="middle"
                  class="year-label"
                >
                  {{ p.label }}
                </text>
              }
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
}
<button type="button" class="btn btn-ghost btn-xs rounded-full replay" (click)="replay()">
  <app-icon name="replay" size="0.9rem" /> Replay
</button>
