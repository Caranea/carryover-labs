# The Angular app is served by Netlify. The API runs on Heroku as one always-on dyno, because it
# keeps jobs and the daily spending total in memory (docs/architecture.md, "Limits").

[build]
  # The optional 555 MB GPU model is left out: every download would count against Netlify bandwidth.
  # Without it the app uses the CPU model from Hugging Face.
  command = "npm run build && node -e \"fs.rmSync('dist/carryover-labs/browser/models', { recursive: true, force: true })\""
  publish = "dist/carryover-labs/browser"

[build.environment]
  # The browser build needs no install scripts (they only fetch native ONNX binaries for Node).
  NPM_FLAGS = "--ignore-scripts"

[[redirects]]
  from = "/api/*"
  # Replace with the host from: heroku apps:info -s
  to = "https://YOUR-API-HOST/api/:splat"
  status = 200
  force = true

# Client-side routes such as /demo. Existing files are served as they are.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep in step with api/src/security/http-security.ts, which covers the Docker deployment.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Cross-Origin-Resource-Policy = "same-origin"
